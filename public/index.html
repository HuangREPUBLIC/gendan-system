<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>跟单系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1C4E9D">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- iOS 添加到主屏后全屏运行 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="跟单">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"><div class="login-page"><div class="login-inner"><div class="login-brand">
    <div class="login-logo">
      <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="boot-lg-bg" x1="60" y1="30" x2="440" y2="490" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4C97DC"/><stop offset=".55" stop-color="#1E63AE"/><stop offset="1" stop-color="#10386C"/>
          </linearGradient>
          <linearGradient id="boot-lg-gloss" x1="90" y1="60" x2="300" y2="300" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF" stop-opacity=".26"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#boot-lg-bg)"/>
        <path d="M116 0h280a116 116 0 0 1 116 116v70C420 96 300 40 176 40 152 40 128 42 106 46A116 116 0 0 1 116 0Z" fill="url(#boot-lg-gloss)"/>
        <path d="M108 274 L206 372 L344 150" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"
              stroke-linejoin="round" stroke-dasharray="66 46" opacity=".97"/>
        <path d="M336 164 L424 76" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
        <ellipse cx="434" cy="66" rx="27" ry="17" transform="rotate(-45 434 66)" fill="none" stroke="#FFFFFF" stroke-width="15"/>
      </svg>
    </div>
    <p class="login-company">天津锦利国际贸易有限公司</p>
    <h1 class="login-title">跟单系统</h1>
  </div></div></div></div>
  <div class="msg" id="msg" role="status"></div>
  <div class="mask" id="mask"></div>
  <script>
    // 锁定屏幕：禁止手机上双指/双击缩放整个页面
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
  </script>
  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
